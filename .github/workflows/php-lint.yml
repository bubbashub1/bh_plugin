name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' | sort)
